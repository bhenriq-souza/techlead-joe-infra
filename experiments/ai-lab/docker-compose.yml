# =============================================================================
# AI Lab — Setup oficial da workstation (Fase 1: Docker Compose)
# =============================================================================

name: ai-lab

services:

  # ---------------------------------------------------------------------------
  # Ollama — engine de geracao (LLM)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ai-lab-ollama
    restart: unless-stopped

    ports:
      - "0.0.0.0:${OLLAMA_PORT:-11434}:11434"

    volumes:
      - /data/models/ollama:/root/.ollama

    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MAX_LOADED_MODELS=2

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - ai-lab-net

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Grafana Alloy — coleta logs Docker do Ollama e envia para Loki do homelab
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:latest
    container_name: ai-lab-alloy
    restart: unless-stopped

    depends_on:
      - ollama

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    ports:
      # UI local do Alloy para debug:
      # acesse no próprio ai-lab: http://localhost:12345
      - "127.0.0.1:12345:12345"

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      - LOKI_PUSH_URL=${LOKI_PUSH_URL:-http://loki.homelab.local/loki/api/v1/push}

    extra_hosts:
      # Garante resolução do hostname do Loki dentro do container Alloy
      - "loki.homelab.local:${HOMELAB_IP:-192.168.15.97}"

    networks:
      - ai-lab-net

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# Rede dedicada
# =============================================================================
networks:
  ai-lab-net:
    name: ai-lab_network
    driver: bridge

volumes:
  alloy-data:
    name: ai-lab_alloy_data